<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VLG Assessment -- Value Communication (accordion mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Genius Drive brand tokens -- from Claude outputs/tokens-doc.md, verified
     against geniusdrive.com (Sep 3 2026 crawl). */
  --gd-ink-blue:#0E4570; --gd-charcoal:#3F3F41; --gd-muted-blue:#81A1B7;
  --gd-teal-primary:#18876D; --gd-teal-light:#8AC3B6; --gd-sky-light:#D9EEFD;
  --gd-surface-gray:#EFEFEF; --gd-meta-gray:#ADADAD; --gd-white:#FFFFFF;

  /* Semantic roles, mapped from the K1x PMTC accordion+segment-slider pattern
     being ported (see wireframe/DESIGN_DECISIONS.md) onto GD's tokens. Names
     kept as the K1x CSS below already uses them -- only the values change, so
     the ported goal-card/segment-slider rules needed no renaming. --slate,
     --slate-light and --rule have no direct GD-verified token (tokens-doc.md
     didn't extract a neutral-gray scale) -- these are interpolated
     placeholders pending design lock, flagged for review, not verified the
     way the GD-prefixed tokens above are. */
  --ink: var(--gd-charcoal);
  --ink-soft: #5C5C5E;
  --slate: #75757A;
  --slate-light: #C7CBCC;
  --rule: #E3E5E6;
  --bone: var(--gd-surface-gray);
  --paper: var(--gd-white);
  --signal: var(--gd-sky-light);
  --signal-ink: var(--gd-ink-blue);
  --accent: var(--gd-teal-primary);
  --accent-light: var(--gd-teal-light);

  --font-display:'Montserrat',Helvetica,Arial,sans-serif;
  --font-ui:'Open Sans',Helvetica,Arial,sans-serif;
  --font-mono:'Prompt',Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-ui);background:var(--bone);color:var(--ink);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;}
.shell{max-width:960px;margin:0 auto;padding:0 24px 96px;}
a{color:inherit;}

/* Hero band -- navy gradient, ported from the locked Results hero band
   (Ben's call; K1x's Picture1.png + scrim treatment is parked, not ruled
   out for later). */
.hero-band{background:linear-gradient(135deg, #0A2F4D 0%, #0E4570 42%, #0C4A48 100%);}
.hero-inner{max-width:960px;margin:0 auto;padding:0 24px;}
.pillar-tag{display:inline-block;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gd-ink-blue);background:var(--gd-sky-light);padding:4px 10px;margin:28px 0 14px;}
.pillar-name{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1.15;letter-spacing:-.01em;color:#fff;margin-bottom:10px;}
.pillar-question{font-size:16px;line-height:1.5;color:rgba(255,255,255,.82);max-width:640px;padding-bottom:36px;}

/* Coaching callout (VC!B8) -- VLG's own already-approved treatment (tinted
   background + colored left border), not a K1x element; sits on the light
   page just below the hero band. */
.coach-callout{background:var(--gd-sky-light);border-left:4px solid var(--gd-ink-blue);padding:16px 20px;margin:32px 0 8px;font-size:15.5px;color:var(--gd-charcoal);line-height:1.6;}

/* ============================================================
   Capability accordion -- ported from K1x PMTC assessment.html
   (chevron header / static question / slider mount / trailing-pair
   accordion), GD tokens substituted for K1x's palette. See
   wireframe/DESIGN_DECISIONS.md sections 18, 21, 27, 29, 30.
   ============================================================ */
.goal-card{border-bottom:1px solid var(--rule);}
.goal-row-head{display:flex;align-items:center;gap:10px;padding:16px 0;}
.goal-card[data-clickable="true"] .goal-row-head{cursor:pointer;}
.goal-row-head:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.gc-chevron{visibility:hidden;display:inline-flex;position:relative;width:11px;height:11px;flex-shrink:0;color:var(--ink);transition:transform .18s ease;}
.gc-chevron svg{width:100%;height:100%;}
.goal-card[data-clickable="true"] .gc-chevron{visibility:visible;}
.goal-card[data-state="open"] .gc-chevron{transform:rotate(90deg);}
.goal-card[data-clickable="true"][data-state="open"] .goal-row-head{cursor:default;}
.goal-card[data-clickable="true"][data-state="open"] .gc-chevron{cursor:pointer;}
.goal-card[data-clickable="true"][data-state="open"] .gc-chevron::before{content:'';position:absolute;inset:-5.5px;}
.gc-name{font-family:var(--font-display);font-weight:700;font-size:15.5px;flex:1;transition:font-size .15s,font-weight .15s;}
.goal-card[data-state="open"] .gc-name{font-weight:800;font-size:22px;}
.gc-score{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);flex-shrink:0;}
.gc-score[data-scored="true"]{color:var(--ink);}
.goal-card[data-state="open"] .gc-score{display:none;}
.gc-spark{display:flex;gap:2px;width:64px;height:7px;flex-shrink:0;}
.goal-card[data-state="open"] .gc-spark{display:none;}
.gc-spark i{flex:1;background:var(--slate-light);border-radius:1px;}
.gc-spark i[data-filled="true"]{background:var(--accent);}
.goal-body{display:none;padding-bottom:22px;}
.goal-card[data-state="open"] .goal-body{display:block;}
.goal-slot{width:100%;}
.gc-question{font-size:18px;color:var(--ink);margin:-4px 0 16px;}

.page-footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:40px;padding-top:24px;border-top:1px solid var(--rule);flex-wrap:wrap;}
.validation-msg{font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--gd-ink-blue);min-height:1em;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-ui);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.1em;border-radius:999px;min-height:48px;cursor:pointer;text-decoration:none;transition:background .15s,color .15s;border:none;}
.btn-primary{background:var(--accent);color:#fff;padding:15px 26px;}
.btn-primary:hover:not(:disabled){background:var(--gd-ink-blue);}
.btn-primary:disabled{background:var(--slate-light);color:var(--paper);cursor:not-allowed;}
.btn-secondary{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:13px 24px;}
.btn-secondary:hover{background:var(--ink);color:#fff;}

/* ============================================================
   segment-slider component (vendored, inlined per this project's
   one-file-per-page convention -- matches how the K1x PMTC source
   inlines it too). Source: PMTC assessment/segment-slider/segment-slider.css,
   unmodified except for the palette-mapping block at the bottom, which is
   this project's own addition, same as K1x's own palette block was.
   ============================================================ */
.sseg {
  --sseg-seg-h: 15px;
  --sseg-seg-gap: 4px;
  --sseg-empty: #DDE4EA;
  --sseg-empty-line: #A9B6C2;
  --sseg-passed: #123A63;
  --sseg-on: #00A3E0;
  --sseg-passed-line: #0C2340;
  --sseg-ink: #0C2340;
  --sseg-muted: #5B6B7C;
  --sseg-accent-ink: #00699A;
  --sseg-focus: #00699A;
  --sseg-cond: inherit;
  --sseg-field: #C9D4DE;
  --sseg-surface: #FFFFFF;
  --sseg-surface-2: #F4F7F9;
  max-width: 620px;
}
.sseg-said { margin: 0; font-size: clamp(16px, 1.8vw, 18px); font-weight: 500; color: var(--sseg-ink); }
.sseg[data-set="false"] .sseg-said { color: var(--sseg-muted); }
.sseg-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.sseg-badge { margin: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
.sseg-num { font-weight: 700; font-size: clamp(30px, 3.6vw, 38px); line-height: 1; color: var(--sseg-ink); }
.sseg[data-set="false"] .sseg-num { color: var(--sseg-empty-line); }
.sseg-empty { display: inline-block; width: .6em; height: 2px; background: var(--sseg-empty-line); vertical-align: .34em; }
.sseg-of { font-size: 14px; color: var(--sseg-muted); }
.sseg-name { font-family: var(--sseg-cond); font-weight: 600; font-size: clamp(12px, 1.4vw, 13px); letter-spacing: .16em; text-transform: uppercase; color: var(--sseg-accent-ink); margin-left: 6px; }
.sseg[data-set="false"] .sseg-name { color: var(--sseg-muted); }
.sseg-step { margin: 0; display: flex; gap: 6px; flex: none; }
.sseg-btn { width: 34px; height: 34px; border: 1px solid var(--sseg-field); background: var(--sseg-surface); color: var(--sseg-ink); font-size: 14px; line-height: 1; cursor: pointer; }
.sseg-btn:hover { border-color: var(--sseg-passed-line); background: var(--sseg-surface-2); }
.sseg-btn:disabled { color: var(--sseg-field); cursor: default; background: var(--sseg-surface); }
.sseg-btn:disabled:hover { border-color: var(--sseg-field); }
.sseg-wrap { position: relative; margin-top: 46px; }
.sseg-input { position: absolute; inset: -11px 0; width: 100%; height: auto; margin: 0; opacity: 0; cursor: pointer; appearance: none; -webkit-appearance: none; background: none; touch-action: pan-y; }
.sseg-input::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; }
.sseg-input::-moz-range-thumb { width: 34px; height: 34px; border: 0; }
.sseg-segs { display: grid; gap: var(--sseg-seg-gap); grid-template-columns: repeat(var(--sseg-count), 1fr); pointer-events: none; }
.sseg-seg { height: var(--sseg-seg-h); background: var(--sseg-empty); border-bottom: 2px solid var(--sseg-empty-line); }
.sseg-seg[data-passed="true"] { background: var(--sseg-passed); border-bottom-color: var(--sseg-passed-line); }
.sseg-seg[data-on="true"] { background: var(--sseg-on); border-bottom-color: var(--sseg-passed-line); }
.sseg-input:focus-visible ~ .sseg-segs { outline: 2px solid var(--sseg-focus); outline-offset: 3px; }
/* Tick labels: VLG's original numeric-tick-plus-hover-label behavior, kept
   as-is rather than K1x's always-visible level-name words (ticks:true gives
   numerals 0-5; the full label -- e.g. "Reacting (0)" -- shows via native
   title-attribute tooltip on hover/focus, added in JS after each slider
   mounts). Dotted underline hints that a tick is hoverable. */
.sseg-ticks { margin: 7px 0 0; display: grid; gap: var(--sseg-seg-gap); grid-template-columns: repeat(var(--sseg-count), 1fr); }
.sseg-tick { font-family: var(--sseg-cond); font-weight: 600; font-size: 12px; letter-spacing: .1em; color: var(--sseg-muted); text-align: center; cursor: help; border-bottom: 1px dotted var(--sseg-field); padding-bottom: 2px; width: fit-content; margin: 0 auto; }
.sseg-tick[data-on="true"] { color: var(--sseg-ink); font-weight: 700; border-bottom-color: var(--sseg-ink); }
.sseg-ends { margin: 8px 0 0; display: flex; justify-content: space-between; gap: 16px; font-size: 12px; color: var(--sseg-muted); }
.sseg-read { margin-top: 16px; border-left: 3px solid var(--sseg-on); padding-left: 15px; font-size: 15px; min-height: 3.2em; }
.sseg[data-set="false"] .sseg-read { border-left-color: var(--sseg-field); }
.sseg-read p { margin: 0; line-height: 1.6; text-wrap: pretty; }
.sseg-read p + p { margin-top: 9px; }
.sseg-read .sseg-prompt { color: var(--sseg-muted); }

/* GD palette mapped onto the component's styling hooks -- this project's
   equivalent of K1x's own palette-mapping block. --sseg-on/--sseg-passed use
   GD's teal pair (strong/light) rather than K1x's near-black --ink, since
   teal-primary is GD's actual brand accent; everything else follows the same
   ink/slate/rule roles the goal-card CSS above already maps. */
.sseg{
  --sseg-on: var(--accent);
  --sseg-passed: var(--accent-light);
  --sseg-passed-line: var(--gd-ink-blue);
  --sseg-empty: var(--slate-light);
  --sseg-empty-line: var(--slate);
  --sseg-ink: var(--ink);
  --sseg-muted: var(--slate);
  --sseg-accent-ink: var(--signal-ink);
  --sseg-focus: var(--accent);
  --sseg-cond: var(--font-mono);
  --sseg-field: var(--rule);
  --sseg-surface: var(--paper);
  --sseg-surface-2: var(--bone);
  max-width: none;
  width: 100%;
}

/* ============================================================
   Floating "sliding" label -- pattern reviewed live at
   massgroup.geniusdrive.com (the SMOMA readiness tool this same
   segment-slider component was extracted from, per its own README).
   Always shows the currently selected level's name directly above that
   segment, slides smoothly when the value changes instead of jumping, and
   stays clear of both ends of the bar. Hidden until the capability is
   answered (see updateFloatBadge in the script below). --sseg-active-index
   is set by that same function; --sseg-count is already set by the
   vendored component itself and inherits down to this element for free.
   Position is computed in JS (see positionFloatBadge below) from the
   badge's own measured width, the same technique the live reference site
   uses -- so it sits dead-center on the active segment except at either
   edge (level 0 or 5), where it pulls in only as far as needed to stay
   fully on-screen. */
.gc-float-badge{
  position: absolute; bottom: 100%; margin-bottom: 10px;
  left: 0;
  transform: translateX(-50%);
  opacity: 0;
  visibility: hidden;
  background: var(--paper);
  border-bottom: 2px solid var(--accent);
  padding: 5px 12px;
  white-space: nowrap;
  font-family: var(--font-mono); font-weight: 700; font-size: 12px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--signal-ink);
  box-shadow: 0 2px 6px rgba(14,69,112,.12);
  transition: left .32s cubic-bezier(.22,.75,.2,1), opacity .2s ease, background-color .2s ease, border-color .2s ease;
  pointer-events: none;
  z-index: 2;
}
</style>
</head>
<body>
<div class="hero-band">
  <div class="hero-inner">
    <span class="pillar-tag">1 OF 3</span>
    <p class="pillar-name">Value Communication</p>
    <p class="pillar-question">Does your team tell a value story - or pitch features?</p>
  </div>
</div>
<div class="shell">

  <p class="coach-callout">Rate where your team stands today for each capability below. Be honest - the recommendations on the Results page get sharper the more accurately you score. There are no wrong answers, only useful ones.</p>

  <form id="assessmentForm" method="post" action="#">

    <div id="cap-list"></div>

    <div class="page-footer">
      <!-- Placeholder link -- mockup stage only, not wired to the real profile page yet. -->
      <a class="btn btn-secondary" href="#">&larr; Back</a>
      <div style="display:flex;align-items:center;gap:16px;">
        <p class="validation-msg" id="startValidationMsg" role="status" aria-live="polite"></p>
        <button type="button" class="btn btn-primary" id="nextBtn" disabled>Next &rarr;</button>
      </div>
    </div>

    <input type="hidden" id="rating_strategy_governance" name="rating_strategy_governance">
    <input type="hidden" id="rating_people" name="rating_people">
    <input type="hidden" id="rating_attract" name="rating_attract">
    <input type="hidden" id="rating_engage" name="rating_engage">
    <input type="hidden" id="rating_sell" name="rating_sell">
    <input type="hidden" id="rating_retain_expand" name="rating_retain_expand">
    <input type="hidden" id="rating_tools_technology" name="rating_tools_technology">
    <input type="hidden" id="rating_intelligence_optimization" name="rating_intelligence_optimization">

  </form>
</div>
<script>
/* segment-slider - a range input painted as discrete segments, which can start
 * unanswered.
 *
 * No dependencies, no build step. Vendored unmodified from
 * PMTC assessment/segment-slider/segment-slider.js -- see that folder's own
 * README for the full design rationale (why a native range can't do this,
 * and the four real bugs documented there for anyone touching input
 * handling). This project's only addition is the GD palette/tick styling in
 * the <style> block above and the tick-tooltip wiring in the next <script>
 * block -- the component itself is untouched.
 */

(function (root) {
  'use strict';

  const KEYS = {
    ArrowUp: 1, ArrowRight: 1, PageUp: 1,
    ArrowDown: -1, ArrowLeft: -1, PageDown: -1,
    Home: null, End: null,
  };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  const paras = (text, cls) => String(text).split(/\n{2,}/)
    .map((p) => `<p${cls ? ` class="${cls}"` : ''}>${esc(p)}</p>`).join('');

  class SegmentSlider {
    constructor(host, opts) {
      if (!host) throw new Error('SegmentSlider: no host element');
      if (!opts || !Array.isArray(opts.segments) || opts.segments.length < 2)
        throw new Error('SegmentSlider: needs at least two segments');

      this.host = host;
      this.o = Object.assign({
        value: null,
        readout: 'label',
        unsetLabel: 'Not answered yet',
        ticks: false,
        ends: false,
        stepper: false,
        descriptions: null,
        unsetDescription: 'Move the slider to choose.',
        ofLabel: '',
        numerals: null,
        ariaLabel: 'Rating',
        onChange: null,
        onSettle: null,
        onDragStart: null,
      }, opts);

      this.count = this.o.segments.length;
      this.numerals = this.o.numerals
        || Array.from({ length: this.count }, (_, i) => i);
      this._value = this.o.value === undefined ? null : this.o.value;
      this._dragging = false;

      this._build();
      this._wire();
      this.paint();
    }

    get value() { return this._value; }
    get isSet() { return this._value !== null; }

    set(index) {
      const at = Math.max(0, Math.min(this.count - 1, index));
      if (this._value === at) return;
      this._value = at;
      this.paint();
      if (this.o.onChange) this.o.onChange(at);
    }

    clear() {
      if (this._value === null) return;
      this._value = null;
      this.paint();
      if (this.o.onChange) this.o.onChange(null);
    }

    nudge(step) {
      this.set(this._value === null ? 0 : this._value + step);
    }

    destroy() {
      this.host.innerHTML = '';
      this.el = this.input = null;
    }

    _readKey() { return this.isSet ? String(this._value) : ''; }

    _readHTML() {
      return this.isSet
        ? paras(this.o.descriptions[this._value])
        : `<p class="sseg-prompt">${esc(this.o.unsetDescription)}</p>`;
    }

    _build() {
      const o = this.o;
      const segs = o.segments
        .map(() => '<i class="sseg-seg" data-passed="false" data-on="false"></i>')
        .join('');

      const tickLabels = o.ticks === true
        ? this.numerals.map(String)
        : (Array.isArray(o.ticks) ? o.ticks : null);

      const badge = o.readout === 'badge' || o.stepper ? `
        <div class="sseg-top">
          ${o.readout === 'badge' ? `<p class="sseg-badge">
            <span class="sseg-num" data-part="num"></span>
            ${o.ofLabel ? `<span class="sseg-of">${esc(o.ofLabel)}</span>` : ''}
            <span class="sseg-name" data-part="name"></span>
          </p>` : '<span></span>'}
          ${o.stepper ? `<p class="sseg-step">
            <button type="button" class="sseg-btn" data-step="-1"
                    aria-label="Down one step: ${esc(o.ariaLabel)}">&minus;</button>
            <button type="button" class="sseg-btn" data-step="1"
                    aria-label="Up one step: ${esc(o.ariaLabel)}">+</button>
          </p>` : ''}
        </div>` : '';

      this.host.innerHTML = `
        <div class="sseg" data-set="false" style="--sseg-count:${this.count}">
          ${badge}
          ${o.readout === 'label'
            ? '<p class="sseg-said" data-part="said"></p>' : ''}
          <div class="sseg-wrap">
            <input type="range" class="sseg-input" data-part="input"
                   min="0" max="${this.count - 1}" step="1" value="0"
                   aria-label="${esc(o.ariaLabel)}">
            <div class="sseg-segs" data-part="segs" aria-hidden="true">${segs}</div>
          </div>
          ${tickLabels ? `<p class="sseg-ticks" data-part="ticks" aria-hidden="true">${
            tickLabels.map((t) => `<span class="sseg-tick">${esc(t)}</span>`).join('')
          }</p>` : ''}
          ${o.ends ? `<p class="sseg-ends" aria-hidden="true">
            <span>${esc(o.segments[0])}</span>
            <span>${esc(o.segments[this.count - 1])}</span>
          </p>` : ''}
          ${o.descriptions ? `<div class="sseg-read" data-part="read"
                 aria-live="polite" data-at="${this._readKey()}"
                 >${this._readHTML()}</div>` : ''}
        </div>`;

      const part = (name) => this.host.querySelector(`[data-part="${name}"]`);
      this.el = this.host.querySelector('.sseg');
      this.input = part('input');
      this.parts = {
        said: part('said'), num: part('num'), name: part('name'),
        segs: part('segs'), ticks: part('ticks'), read: part('read'),
      };
    }

    paint() {
      const set = this.isSet;
      const at = this._value;
      const label = set ? this.o.segments[at] : this.o.unsetLabel;

      this.el.dataset.set = set ? 'true' : 'false';
      if (this.parts.said) this.parts.said.textContent = label;
      if (this.parts.num)
        this.parts.num.innerHTML = set
          ? esc(String(this.numerals[at])) : '<i class="sseg-empty"></i>';
      if (this.parts.name) this.parts.name.textContent = label;

      this.input.value = String(set ? at : 0);
      this.input.setAttribute('aria-valuetext', label);

      Array.from(this.parts.segs.children).forEach((seg, i) => {
        seg.dataset.passed = set && i < at ? 'true' : 'false';
        seg.dataset.on = set && i === at ? 'true' : 'false';
      });
      if (this.parts.ticks)
        Array.from(this.parts.ticks.children).forEach((tick, i) => {
          tick.dataset.on = set && i === at ? 'true' : 'false';
        });

      for (const button of this.el.querySelectorAll('.sseg-btn')) {
        const dir = +button.dataset.step;
        button.disabled = set && (dir < 0 ? at === 0 : at === this.count - 1);
      }

      const read = this.parts.read;
      if (read && read.dataset.at !== this._readKey()) {
        read.dataset.at = this._readKey();
        read.innerHTML = this._readHTML();
      }
    }

    _wire() {
      const input = this.input;

      input.addEventListener('keydown', (e) => {
        if (!(e.key in KEYS)) return;
        e.preventDefault();
        const step = KEYS[e.key];
        if (step === null) this.set(e.key === 'Home' ? 0 : this.count - 1);
        else this.nudge(step);
      });

      if (this.o.stepper)
        this.el.addEventListener('click', (e) => {
          const button = e.target.closest('.sseg-btn');
          if (button) this.nudge(+button.dataset.step);
        });

      input.addEventListener('input', () => this.set(+input.value));

      if (typeof PointerEvent !== 'function') return;
      this._wirePointer();
    }

    _wirePointer() {
      const input = this.input;

      const at = (e) => {
        const box = input.getBoundingClientRect();
        if (!box.width) return null;
        return Math.floor((e.clientX - box.left) / box.width * this.count);
      };

      const drag = (e) => {
        if (!this._dragging) return;
        const found = at(e);
        if (found === null) return;
        e.preventDefault();
        this.set(found);
      };

      input.addEventListener('pointerdown', (e) => {
        this._dragging = true;
        this.el.dataset.dragging = 'true';
        input.focus({ preventScroll: true });

          if (this.isSet && this.o.onSettle) this.o.onSettle(this._value);

var CAPS = [{"name": "Strategy & Governance", "question": "How intentionally and consistently do we define, govern, measure, and improve how value is communicated across the organization?", "levels": ["No defined strategy or governance. \n\nValue messaging is inconsistent and content is created reactively. \n\nNo taxonomy, lifecycle management, ownership, or metrics exist.", "Intent to improve exists. \n\nEarly governance ideas and messaging standards are discussed, but remain informal and inconsistently applied.", "Foundational governance structures are defined. \n\nCharter drafted, messaging frameworks created, taxonomy and lifecycle standards introduced. \n\nAdoption is partial.", "Governance is formalized and enforced. \n\nCharter approved, taxonomy implemented, lifecycle rules active, metrics tracked and used to guide improvements.", "Governance is embedded into operating rhythm. \n\nRegular maturity reviews, content audits, and executive updates refine standards and investment decisions.", "Governance operates as a closed-loop, intelligence-driven system. \n\nStrategy, standards, and metrics are continuously optimized and tied directly to revenue and growth outcomes."]}, {"name": "People", "question": "How effectively are people aligned, enabled, and accountable for communicating value consistently and credibly?", "levels": ["Value communication depends on individual talent. \n\nThere is no defined competency model, no structured training, and no accountability for value storytelling quality. \n\nSkills vary widely across sellers, SEs, and leaders.", "Leaders recognize capability gaps. \n\nInformal coaching or ad hoc training on value messaging begins. \n\nSome high performers model strong value communication, but skills are not standardized or scalable.", "Core value communication competencies are defined. \n\nStructured training programs are introduced. Managers begin coaching on value narratives. \n\nHiring profiles start reflecting value storytelling expectations. Adoption is uneven.", "Value communication competencies are embedded into onboarding, certification, and performance reviews. \n\nManagers are trained to coach on value storytelling. \n\nField execution quality is measured and reinforced.", "Continuous skill development is embedded. \n\nAdvanced storytelling, executive communication, and industry value positioning programs are active. \n\nPeer best practices are shared across teams. \n\nLeadership reinforces value communication as a cultural expectation.", "Value communication excellence is institutionalized. \n\nCompetencies are benchmarked across roles and regions. \n\nAI-assisted coaching and performance analytics proactively guide development. \n\nTalent strategy, hiring, promotion, and compensation reinforce value-led behaviors."]}, {"name": "Attract", "question": "How effectively do we use value storytelling to attract the right buyers, shape early perceptions, and drive demand across segments and personas?", "levels": ["External messaging is product- or feature-focused. \n\nNo defined value storytelling framework by industry, role, or use case. \n\nCampaigns, thought leadership, and events are ad hoc and disconnected from customer outcomes.", "Intent to shift toward value-based messaging. \n\nEarly pain-point and outcome language appears in prospecting and content. \n\nSome value-oriented blogs or events exist, but messaging is inconsistent and not tailored by ICP or persona.", "Foundational value storytelling frameworks are defined by industry, role, and use case. \n\nPersona-specific value briefs and branded assets are created. \n\nEarly value-based campaigns are launched, though execution and distribution are uneven.", "Value storytelling consistently drives demand generation.\n\n Campaigns, blogs, white papers, webinars, and events align to defined value narratives by ICP and persona. \n\nMessaging consistency is enforced across marketing and early sales.", "Value attraction is embedded into brand and demand strategy. \n\nFrameworks are refined using performance data. \n\nIndustry thought leadership and customer outcome events reinforce authority and pipeline quality.", "Value-led attraction operates as a coordinated, insight-driven system. \n\nICP-specific value narratives are continuously optimized across channels and regions. \n\nValue storytelling predictably drives high-quality demand and positions the company as a trusted authority."]}, {"name": "Engage", "question": "How consistently do we engage buyers with value-led conversations, interactive assets, and education that adapt to their needs, use cases, and maturity?", "levels": ["Buyer engagement is reactive and product-led. \n\nDiscovery is informal. \n\nUse cases are not mapped to value. \n\nPresentations focus on features. \n\nConversations cannot pivot based on buyer maturity or needs. \n\nContent sharing is static and disconnected from journey stages.", "Teams acknowledge the need for stronger value conversations. \n\nBasic playbooks or value decks are introduced. \n\nSome interactive assets are piloted, but they are not consistently tailored by account, persona, or use case.", "Use cases are mapped to value outcomes. \n\nStructured discovery guides and playbooks are created. \n\nEarly point-of-value decks and value-led demos are introduced. \n\nCapability and maturity guides begin educating buyers. \n\nAdoption varies by team.", "Value-led engagement is consistently applied. \n\nSellers guide account-specific value plays, pivot conversations using interactive decks, and anchor discovery in structured value frameworks. \n\nCurated portals and digital selling rooms are used to share relevant content aligned to buyer needs.", "Engagement is embedded into operating rhythm. \n\nCapability and maturity guides shape buyer roadmaps. \n\nValue demos reinforce outcomes over features. \n\nDigital engagement assets are refined using interaction data and performance insights.", "Value-led engagement is orchestrated end to end. \n\nConversations dynamically adapt by role, use case, and maturity. \n\nInteractive assets and data-driven insights guide next best value actions. \n\nDigital selling rooms function as collaborative, living value narratives at scale."]}, {"name": "Sell", "question": "How effectively do we use value communication to guide executive conversations, advance deals, and understand what drives wins and losses?", "levels": ["Value communication in sales is inconsistent and seller-dependent. \n\nExecutive conversations are product-focused. \n\nBuyer value stories are not co-created. \n\nContent is shared without visibility into engagement. \n\nThere is little insight into what influences deal progression or outcomes.", "Teams recognize the need for stronger value narratives in sales. \n\nEarly templates or executive decks exist. \n\nCompetitive messaging begins shifting toward outcomes. \n\nContent tracking is sporadic, and insights into engagement or win drivers are limited and not actionable.", "Standardized templates for business cases, value proposals, and shared value plans are introduced. \n\nCompetitive battlecards are reframed around outcomes. \n\nContent engagement tracking begins. \n\nSellers start collaborating with buyers on a value story, though usage varies.", "Value-led selling is consistently applied. \n\nExecutive conversations focus on outcomes and business impact. \n\nSellers co-create buyer value narratives using standardized templates. \n\nContent engagement and deal progression signals are tracked to understand win and loss drivers.", "Value communication is embedded into deal governance. \n\nEngagement data informs coaching and next best actions. \n\nPrescriptive playbooks guide executive conversations. \n\nWin/loss analysis systematically refines messaging, battlecards, and value positioning.", "Value-led selling is orchestrated at scale. \n\nExecutive conversations, buyer-collaborative value stories, and competitive positioning are dynamically guided by data. \n\nContent influence and deal signals continuously optimize win rates, deal quality, and sales efficiency across segments."]}, {"name": "Retain & Expand", "question": "How consistently do we communicate realized value to reinforce confidence, guide renewals, and drive expansion across the customer lifecycle?", "levels": ["Post-sale value communication is reactive and renewal-driven. \n\nExpansion discussions lack a roadmap. \n\nRealized value is not consistently communicated. \n\nSuccess stories are anecdotal. \n\nCustomer data and feedback are rarely used to guide retention or growth.", "The organization acknowledges the need to reinforce value after the sale. \n\nRealized outcomes are occasionally referenced in QBRs. \n\nSome success stories are created. \n\nMessaging is inconsistent and not tailored by role, industry, or maturity.", "Expansion plays and roadmaps are defined. \n\nA value messaging framework is introduced for QBRs and ongoing engagements. \n\nQualitative impact surveys capture customer outcomes. \n\nEarly success stories are developed, though personalization varies.", "Customer success teams consistently leverage realized value KPIs and qualitative insights in QBRs. \n\nExpansion plays are structured around defined value outcomes. \n\nSuccess stories are developed by role, industry, maturity, and use case to reinforce credibility.", "Value communication is embedded into customer lifecycle management. \n\nRealized value data, success stories, and post-sale messaging frameworks are continuously refined. \n\nPrescriptive next steps and content recommendations guide renewals and expansion.", "Retention and expansion are orchestrated through value intelligence. Realized value insights and customer narratives dynamically shape renewal and growth strategy. Value communication strengthens executive alignment and predictably drives retention and expansion at scale."]}, {"name": "Tools / Technology", "question": "How well do our tools and data enable scalable, insight-driven, and increasingly intelligent value communication across teams and buyers?", "levels": ["Value content is scattered across systems, drives, and teams with no central source of truth. \n\nSellers struggle to find materials. Reuse is limited. \n\nThere is no visibility into usage or engagement. \n\nDigital selling experiences are minimal or nonexistent.", "The need for better tooling is recognized. \n\nEarly efforts centralize content and improve search. \n\nBasic usage tracking is introduced. \n\nCapabilities remain fragmented, adoption is inconsistent, and insights are descriptive rather than actionable.", "Content is centralized for internal teams and partners. \n\nReusable content sets and deck builders are introduced. \n\nOffline access is supported. \n\nUsage and engagement data are captured, but analysis and optimization remain limited.", "Tools are consistently used across GTM teams. \n\nSellers quickly assemble and share relevant value content through digital selling rooms. \n\nOnline and offline engagement is supported. \n\nUsage and performance data inform enablement and content decisions.", "Technology is embedded into GTM workflows. \n\nPerformance insights drive continuous optimization. \n\nUnderused content is audited and retired. \n\nLocalization is managed at scale. \n\nDigital selling rooms operate as dynamic, interactive value experiences. \n\nData increasingly guides recommendations.", "Technology operates as a data-driven, AI-powered value communication system. \n\nContent discovery, assembly, sharing, and optimization are continuously refined using engagement and outcome insights. \n\nDigital experiences dynamically adapt by role, market, deal context, and buyer behavior."]}, {"name": "Intelligence & Optimization", "question": "How effectively do we measure, analyze, and optimize the impact of our value communication across the buyer journey?", "levels": ["There is little to no visibility into value communication performance. \n\nContent usage, buyer engagement, and narrative effectiveness are not tracked. \n\nTeams rely on anecdotal feedback. No dashboards, scoring models, or revenue correlations exist.", "The need for measurement is recognized. Basic activity metrics such as downloads or views are available but fragmented. \n\nReporting is manual and retrospective. \n\nEngagement and deal influence are not systematically analyzed.", "Foundational tracking is implemented. \n\nContent usage, digital room access, and engagement metrics are captured. \n\nEarly dashboards show content influence on opportunities. \n\nMeasurement exists but is inconsistent and not standardized.", "Intelligence is consistently tracked and reported. \n\nUnified dashboards correlate content usage, engagement signals, and opportunity progression. \n\nBuyer interaction data informs coaching. \n\nEarly quality standards for value storytelling are defined.", "Intelligence is embedded into operating rhythm. \n\nNarrative effectiveness, buyer consensus indicators, and engagement timing are measured and optimized. \n\nContent performance is tied to win rates, deal velocity, retention, and expansion. \n\nValue communication quality is formally scored.", "A closed-loop, predictive intelligence system operates at scale. \n\nMulti-source revenue, engagement, and content data are unified. \n\nAI-driven insights proactively guide sellers on optimal narratives and timing. \n\nPerformance is forecasted, benchmarked, and continuously optimized across segments and markets."]}];
var LEVEL_NAMES = ["Reacting", "Aspiring", "Constructing", "Operationalizing", "Composing", "Orchestrating"];
var MATURITY_LABELS = ["Reacting (0)", "Aspiring (1)", "Constructing (2)", "Operationalizing (3)", "Composing (4)", "Orchestrating (5)"];
var CAPABILITY_KEYS = ["strategy_governance", "people", "attract", "engage", "sell", "retain_expand", "tools_technology", "intelligence_optimization"];

var sliders = new Array(CAPS.length).fill(null);
var cards = new Array(CAPS.length).fill(null);
var heads = new Array(CAPS.length).fill(null);
var scoreEls = new Array(CAPS.length).fill(null);
var sparkEls = new Array(CAPS.length).fill(null);
var mounts = new Array(CAPS.length).fill(null);
var floatBadges = new Array(CAPS.length).fill(null);

// Trailing-pair accordion (ported from PMTC assessment.html -- see
// DESIGN_DECISIONS.md sections 27/29/30). Answering the open frontier card
// never closes that card itself: it opens the next card below it, and
// closes whichever card was open *before* the one just answered -- up to
// two cards open at once, a sliding window rather than a single slot.
// Independent per pillar page -- this file's frontier/frontierOlder/
// reviewCard state governs only this page's 8 capabilities.
var frontier = 0;
var frontierOlder = null;
var reviewCard = null;
var manuallyClosed = {};

function chevronSvg(){
  return '<svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function updateScoreLabel(i){
  var el = scoreEls[i];
  if (sliders[i].isSet) {
    el.textContent = LEVEL_NAMES[sliders[i].value].toUpperCase();
    el.dataset.scored = 'true';
  } else {
    el.textContent = 'NOT SCORED';
    el.dataset.scored = 'false';
  }
}

// Collapsed-row sparkline (ported from DESIGN_DECISIONS.md section 21): a
// miniature version of the segment bar, filled up to and including the
// answer. Hidden while the card is open (the real slider already shows
// this); unscored rows render every segment unfilled rather than omitting
// the sparkline, so every collapsed row reads the same shape at a glance.
function updateSpark(i){
  var segs = sparkEls[i].children;
  for (var s = 0; s < segs.length; s++){
    segs[s].dataset.filled = (sliders[i].isSet && s <= sliders[i].value) ? 'true' : 'false';
  }
}

function updateNextButtonState(){
  var answeredCount = sliders.filter(function(s){ return s && s.isSet; }).length;
  var btn = document.getElementById('nextBtn');
  var msg = document.getElementById('startValidationMsg');
  if (answeredCount < CAPS.length) {
    btn.disabled = true;
    msg.textContent = 'Answer all ' + CAPS.length + ' capabilities to continue.';
  } else {
    btn.disabled = false;
    msg.textContent = '';
  }
}

function setCardState(i, state){
  cards[i].dataset.state = state;
  heads[i].setAttribute('aria-expanded', state === 'open' ? 'true' : 'false');
}

function isOpen(i){
  if (manuallyClosed[i]) return false;
  if (reviewCard !== null) return i === frontier || i === reviewCard;
  return i === frontier || i === frontierOlder;
}

function syncOpenStates(){
  for (var k = 0; k < CAPS.length; k++){
    setCardState(k, isOpen(k) ? 'open' : 'closed');
  }
}

function toggleOrReview(i){
  if (cards[i].dataset.clickable !== 'true') return;
  if (isOpen(i)) return;
  reviewCard = i;
  manuallyClosed[i] = false;
  syncOpenStates();
}

function closeCard(i){
  if (cards[i].dataset.clickable !== 'true') return;
  if (!isOpen(i)) return;
  withScrollAnchor(cards[i], function(){
    if (i === reviewCard) reviewCard = null;
    manuallyClosed[i] = true;
    syncOpenStates();
  });
}

function withScrollAnchor(anchorEl, fn){
  var before = anchorEl.getBoundingClientRect().top;
  fn();
  var after = anchorEl.getBoundingClientRect().top;
  if (after !== before) window.scrollBy(0, after - before);
}

function settleCard(i){
  if (!sliders[i].isSet) return;
  if (i === frontier){
    withScrollAnchor(cards[i], function(){
      if (frontier < CAPS.length - 1){
        frontierOlder = frontier;
        frontier = frontier + 1;
      } else {
        frontierOlder = null;
      }
      reviewCard = null;
      syncOpenStates();
    });
  } else if (i === reviewCard){
    reviewCard = null;
    syncOpenStates();
  }
}

function handleChange(i){
  updateScoreLabel(i);
  updateFloatBadge(i);
  updateSpark(i);
  var clickable = sliders[i].isSet;
  cards[i].dataset.clickable = clickable ? 'true' : 'false';
  if (clickable) {
    heads[i].setAttribute('tabindex', '0');
    heads[i].setAttribute('role', 'button');
  } else {
    heads[i].removeAttribute('tabindex');
    heads[i].removeAttribute('role');
  }
  updateNextButtonState();
}

// Native title-attribute tooltip on each numeral tick, showing the full
// maturity label (e.g. "Reacting (0)") on hover/focus -- VLG's original
// slider-label behavior, kept instead of porting K1x's always-visible
// level-name ticks. Ticks are static (six fixed positions), so this only
// needs to run once, right after the slider builds its markup.
function addTickTooltips(mount){
  var ticks = mount.querySelectorAll('.sseg-tick');
  for (var t = 0; t < ticks.length && t < MATURITY_LABELS.length; t++){
    ticks[t].setAttribute('title', MATURITY_LABELS[t]);
    ticks[t].setAttribute('tabindex', '0');
    ticks[t].setAttribute('aria-label', MATURITY_LABELS[t]);
  }
}

// Floating "sliding" label above the selected segment -- ported from the
// live pattern at massgroup.geniusdrive.com (built on this same
// segment-slider lineage; see the vendored component's own README credit
// to "the SMOMA readiness tool"). Not part of the vendored component --
// built and wired here the same way that reference site's own version is,
// on top of the component's onChange hook, not inside segment-slider.js
// itself. One badge element per card, created once at build time and
// repositioned/relabeled on every change.
function addFloatingBadge(mount){
  var wrap = mount.querySelector('.sseg-wrap');
  var badge = document.createElement('span');
  badge.className = 'gc-float-badge';
  // Decorative echo of the answer -- the slider's own aria-valuetext
  // already carries this to screen readers (see segment-slider.js paint()),
  // so this floating copy is hidden from the accessibility tree rather
  // than announced a second time.
  badge.setAttribute('aria-hidden', 'true');
  wrap.appendChild(badge);
  return badge;
}

// Centers the badge over the middle of the active segment, in pixels,
// using the badge's own measured width -- not a guessed constant -- so it
// only pulls in from dead-center the minimum needed to stay fully inside
// the wrap. Left visible/measurable at all times (opacity/visibility, not
// display:none) so offsetWidth is always accurate, including the instant
// a capability is first answered.
function positionFloatBadge(i){
  var badge = floatBadges[i];
  var wrap = sliders[i].el.querySelector('.sseg-wrap');
  var count = LEVEL_NAMES.length;
  var wrapWidth = wrap.clientWidth;
  var segWidth = wrapWidth / count;
  var idealCenter = (sliders[i].value + 0.5) * segWidth;
  var half = badge.offsetWidth / 2;
  var center = Math.min(wrapWidth - half, Math.max(half, idealCenter));
  badge.style.left = center + 'px';
}

function updateFloatBadge(i){
  var badge = floatBadges[i];
  if (sliders[i].isSet) {
    badge.textContent = LEVEL_NAMES[sliders[i].value].toUpperCase();
    badge.style.opacity = '1';
    badge.style.visibility = 'visible';
    positionFloatBadge(i);
  } else {
    badge.style.opacity = '0';
    badge.style.visibility = 'hidden';
  }
}

// Keep an already-answered badge correctly centered if the window is
// resized (the wrap's pixel width, and so the segment centers, change).
window.addEventListener('resize', function(){
  for (var ri = 0; ri < sliders.length; ri++) {
    if (sliders[ri] && sliders[ri].isSet) positionFloatBadge(ri);
  }
});

function buildCard(i){
  var cap = CAPS[i];
  var container = document.getElementById('cap-list');

  var card = document.createElement('div');
  card.className = 'goal-card';
  card.dataset.state = (i === 0) ? 'open' : 'closed';
  card.dataset.clickable = 'false';

  var head = document.createElement('div');
  head.className = 'goal-row-head';
  head.setAttribute('aria-expanded', (i === 0) ? 'true' : 'false');

  var chevron = document.createElement('span');
  chevron.className = 'gc-chevron';
  chevron.setAttribute('aria-hidden', 'true');
  chevron.innerHTML = chevronSvg();
  head.appendChild(chevron);

  var nameEl = document.createElement('span');
  nameEl.className = 'gc-name';
  nameEl.textContent = cap.name;

  var scoreEl = document.createElement('span');
  scoreEl.className = 'gc-score';
  scoreEl.textContent = 'NOT SCORED';
  scoreEl.dataset.scored = 'false';

  var spark = document.createElement('span');
  spark.className = 'gc-spark';
  spark.setAttribute('aria-hidden', 'true');
  for (var sp = 0; sp < LEVEL_NAMES.length; sp++){
    var seg = document.createElement('i');
    seg.dataset.filled = 'false';
    spark.appendChild(seg);
  }

  head.appendChild(nameEl);
  head.appendChild(scoreEl);
  head.appendChild(spark);

  var body = document.createElement('div');
  body.className = 'goal-body';

  var questionEl = document.createElement('div');
  questionEl.className = 'gc-question';
  questionEl.textContent = cap.question;
  body.appendChild(questionEl);

  var mount = document.createElement('div');
  mount.className = 'goal-slot';
  body.appendChild(mount);

  card.appendChild(head);
  card.appendChild(body);
  container.appendChild(card);

  head.addEventListener('click', function(){ toggleOrReview(i); });
  head.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    toggleOrReview(i);
  });

  cards[i] = card;
  heads[i] = head;
  scoreEls[i] = scoreEl;
  sparkEls[i] = spark;
  mounts[i] = mount;

  sliders[i] = new SegmentSlider(mount, {
    segments: LEVEL_NAMES,
    value: null,
    readout: 'none',
    ticks: true,
    stepper: false,
    ends: false,
    descriptions: cap.levels,
    unsetDescription: 'Click to select the level that matches your current practice.',
    ariaLabel: cap.name + ' maturity level',
    onChange: function(){ handleChange(i); },
    onSettle: function(){ settleCard(i); },
  });
  addTickTooltips(mount);
  floatBadges[i] = addFloatingBadge(mount);

  sliders[i].input.addEventListener('blur', function(){ settleCard(i); });

  updateSpark(i);
}

// §31-equivalent voluntary close via chevron -- wired up after buildCard
// so it can reach closeCard/withScrollAnchor by index without re-deriving
// it from the DOM inside buildCard's own chevron handler above.
for (var gi = 0; gi < CAPS.length; gi++) buildCard(gi);
for (var ci = 0; ci < CAPS.length; ci++){
  (function(idx){
    cards[idx].querySelector('.gc-chevron').addEventListener('click', function(e){
      if (cards[idx].dataset.state === 'open' && cards[idx].dataset.clickable === 'true'){
        e.stopPropagation();
        closeCard(idx);
      }
    });
  })(ci);
}

updateNextButtonState();

document.getElementById('nextBtn').addEventListener('click', function(){
  var answeredCount = sliders.filter(function(s){ return s && s.isSet; }).length;
  if (answeredCount < CAPS.length) return;
  for (var i = 0; i < CAPS.length; i++) {
    document.getElementById('rating_' + CAPABILITY_KEYS[i]).value = sliders[i].value;
  }
  // Mockup stage only -- no live Flask route to advance to yet. A real
  // build would submit assessmentForm and route to /assess/vq.
  document.getElementById('startValidationMsg').textContent = 'All ' + CAPS.length + ' capabilities rated. (Mockup -- Next would advance to Value Quantification.)';
});
</script>
